<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar Conexión - Supabase</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .test-result {
      margin: 20px 0;
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
    }
    .test-success {
      background: #d4edda;
      color: #155724;
      border: 2px solid #c3e6cb;
    }
    .test-error {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
    }
    .test-info {
      background: #d1ecf1;
      color: #0c5460;
      border: 2px solid #bee5eb;
    }
    .test-step {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .test-step h3 {
      color: #667eea;
      margin-bottom: 10px;
    }
    .code-block {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
      overflow-x: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
    }
    .config-display {
      background: #fff3cd;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
      border-left: 4px solid #ffc107;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="container" style="max-width: 800px;">
      <h1>🔧 Verificador de Configuración</h1>
      <p style="text-align: center; color: #666; margin-bottom: 30px;">
        Esta página te ayudará a verificar que todo esté configurado correctamente
      </p>

      <div id="testResults"></div>

      <div class="test-step">
        <h3>📝 Configuración Actual</h3>
        <div id="configDisplay" class="config-display"></div>
      </div>

      <div class="test-step">
        <h3>🔍 Verificaciones</h3>
        <button onclick="runAllTests()" class="btn btn-primary" style="width: 100%;">
          Ejecutar Todas las Verificaciones
        </button>
      </div>

      <div id="detailedResults"></div>

      <div class="text-center" style="margin-top: 30px;">
        <a href="index.html" class="btn btn-secondary">← Volver al Inicio</a>
      </div>
    </div>
  </div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    // Mostrar configuración actual
    const configDisplay = document.getElementById('configDisplay');
    configDisplay.innerHTML = `
      <p><strong>Supabase URL:</strong> ${SUPABASE_URL}</p>
      <p><strong>Anon Key:</strong> ${SUPABASE_ANON_KEY.substring(0, 20)}...</p>
      <p style="margin-top: 15px; color: #666; font-size: 0.9rem;">
        ⚠️ Si ves "TU_SUPABASE_URL_AQUI", necesitas configurar tus credenciales en config.js
      </p>
    `;

    const testResults = document.getElementById('testResults');
    const detailedResults = document.getElementById('detailedResults');

    async function runAllTests() {
      detailedResults.innerHTML = '<div class="test-info">Ejecutando verificaciones...</div>';
      
      const results = [];

      // Test 1: Verificar que las credenciales estén configuradas
      const test1 = testCredentials();
      results.push(test1);

      if (!test1.success) {
        displayResults(results);
        return;
      }

      // Test 2: Verificar conexión a Supabase
      const test2 = await testConnection();
      results.push(test2);

      // Test 3: Verificar que las tablas existan
      const test3 = await testTables();
      results.push(test3);

      // Test 4: Verificar políticas de seguridad
      const test4 = await testPolicies();
      results.push(test4);

      displayResults(results);
    }

    function testCredentials() {
      if (SUPABASE_URL.includes('TU_SUPABASE') || SUPABASE_ANON_KEY.includes('TU_SUPABASE')) {
        return {
          name: 'Configuración de Credenciales',
          success: false,
          message: 'Las credenciales de Supabase no están configuradas',
          solution: `
            <div class="test-step">
              <h4>Cómo configurar:</h4>
              <ol style="text-align: left; line-height: 1.8;">
                <li>Ve a <a href="https://app.supabase.com" target="_blank">app.supabase.com</a></li>
                <li>Selecciona tu proyecto</li>
                <li>Ve a Settings → API</li>
                <li>Copia la "Project URL" y "anon public" key</li>
                <li>Pégalas en el archivo <code>config.js</code></li>
              </ol>
            </div>
          `
        };
      }
      return {
        name: 'Configuración de Credenciales',
        success: true,
        message: 'Credenciales configuradas correctamente ✅'
      };
    }

    async function testConnection() {
      try {
        const { data, error } = await supabaseClient.from('users').select('count', { count: 'exact', head: true });
        
        if (error && error.message.includes('relation "public.users" does not exist')) {
          return {
            name: 'Conexión a Supabase',
            success: false,
            message: 'Conectado a Supabase, pero las tablas no existen',
            solution: `
              <div class="test-step">
                <h4>Crear las tablas:</h4>
                <ol style="text-align: left; line-height: 1.8;">
                  <li>Abre el archivo <code>setup-database.sql</code></li>
                  <li>Copia TODO el contenido</li>
                  <li>Ve a tu proyecto en Supabase</li>
                  <li>Click en "SQL Editor" (menú lateral)</li>
                  <li>Pega el script y click en "Run"</li>
                </ol>
              </div>
            `
          };
        }
        
        return {
          name: 'Conexión a Supabase',
          success: true,
          message: 'Conexión exitosa a Supabase ✅'
        };
      } catch (error) {
        return {
          name: 'Conexión a Supabase',
          success: false,
          message: `Error de conexión: ${error.message}`,
          solution: 'Verifica que tu URL y API Key sean correctas'
        };
      }
    }

    async function testTables() {
      try {
        // Intentar consultar la tabla users
        const { error: usersError } = await supabaseClient.from('users').select('count', { count: 'exact', head: true });
        
        // Intentar consultar la tabla information
        const { error: infoError } = await supabaseClient.from('information').select('count', { count: 'exact', head: true });
        
        if (usersError || infoError) {
          return {
            name: 'Verificación de Tablas',
            success: false,
            message: 'Una o más tablas no existen',
            solution: `
              <div class="test-step">
                <h4>Crear las tablas:</h4>
                <p>Ejecuta el archivo <code>setup-database.sql</code> en el SQL Editor de Supabase</p>
              </div>
            `
          };
        }
        
        return {
          name: 'Verificación de Tablas',
          success: true,
          message: 'Todas las tablas existen correctamente ✅'
        };
      } catch (error) {
        return {
          name: 'Verificación de Tablas',
          success: false,
          message: `Error al verificar tablas: ${error.message}`
        };
      }
    }

    async function testPolicies() {
      try {
        // Intentar leer información sin estar autenticado
        const { data, error } = await supabaseClient.from('information').select('*');
        
        if (error && error.message.includes('JWT')) {
          return {
            name: 'Políticas de Seguridad (RLS)',
            success: true,
            message: 'Las políticas de seguridad están activas ✅',
            info: 'La base de datos está protegida correctamente. Solo usuarios autenticados pueden acceder.'
          };
        }
        
        return {
          name: 'Políticas de Seguridad (RLS)',
          success: true,
          message: 'Base de datos accesible (verifica las políticas)',
          info: 'Puedes consultar información. Asegúrate de que las políticas RLS estén correctas.'
        };
      } catch (error) {
        return {
          name: 'Políticas de Seguridad (RLS)',
          success: true,
          message: 'Políticas configuradas ✅'
        };
      }
    }

    function displayResults(results) {
      let html = '';
      let allPassed = true;

      results.forEach(result => {
        const className = result.success ? 'test-success' : 'test-error';
        const icon = result.success ? '✅' : '❌';
        
        if (!result.success) allPassed = false;

        html += `
          <div class="test-step">
            <div class="${className}" style="margin-bottom: 15px;">
              ${icon} <strong>${result.name}:</strong> ${result.message}
            </div>
            ${result.info ? `<p style="color: #666; margin: 10px 0;"><em>${result.info}</em></p>` : ''}
            ${result.solution ? result.solution : ''}
          </div>
        `;
      });

      if (allPassed) {
        html = `
          <div class="test-success" style="margin: 20px 0; padding: 20px; text-align: center;">
            <h2>🎉 ¡Todo está configurado correctamente!</h2>
            <p>Tu aplicación está lista para usarse.</p>
            <a href="register.html" class="btn btn-primary" style="margin-top: 15px;">
              Crear mi primera cuenta
            </a>
          </div>
        ` + html;
      }

      detailedResults.innerHTML = html;
    }

    // Ejecutar pruebas automáticamente al cargar
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        runAllTests();
      }, 500);
    });
  </script>
</body>
</html>
