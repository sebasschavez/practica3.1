<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <div class="container">
      <h2>🔐 Iniciar Sesión</h2>
      
      <div id="message"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
        </div>
        
        <button type="submit">Iniciar Sesión</button>
      </form>
      
      <div class="text-center">
        <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
        <p><a href="index.html">← Volver al inicio</a></p>
      </div>
    </div>
  </div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  
  <script>
    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');

    // Verificar si ya está logueado
    window.addEventListener('DOMContentLoaded', async () => {
      const user = await checkAuth();
      if (user) {
        window.location.href = 'dashboard.html';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      // Mostrar mensaje de carga
      messageDiv.innerHTML = '<div class="alert alert-info">Iniciando sesión...</div>';
      
      const result = await login(email, password);
      
      if (result.success) {
        messageDiv.innerHTML = '<div class="alert alert-success">¡Inicio de sesión exitoso! Redirigiendo...</div>';
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } else {
        messageDiv.innerHTML = `<div class="alert alert-error">Error: ${result.error}</div>`;
      }
    });
  </script>
</body>
</html>
