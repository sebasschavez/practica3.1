<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <div class="container">
      <h2>📝 Crear Cuenta</h2>
      
      <div id="message"></div>
      
      <form id="registerForm">
        <div class="form-group">
          <label for="fullName">Nombre Completo</label>
          <input type="text" id="fullName" name="fullName" placeholder="Juan Pérez" required>
        </div>
        
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirma tu contraseña" required>
        </div>
        
        <div class="form-group">
          <label for="role">Tipo de Usuario</label>
          <select id="role" name="role" required>
            <option value="user">Usuario Normal</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        
        <button type="submit">Registrarse</button>
      </form>
      
      <div class="text-center">
        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        <p><a href="index.html">← Volver al inicio</a></p>
      </div>
    </div>
  </div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  
  <script>
    const registerForm = document.getElementById('registerForm');
    const messageDiv = document.getElementById('message');

    // Verificar si ya está logueado
    window.addEventListener('DOMContentLoaded', async () => {
      const user = await checkAuth();
      if (user) {
        window.location.href = 'dashboard.html';
      }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const role = document.getElementById('role').value;
      
      // Validar que las contraseñas coincidan
      if (password !== confirmPassword) {
        messageDiv.innerHTML = '<div class="alert alert-error">Las contraseñas no coinciden</div>';
        return;
      }
      
      // Mostrar mensaje de carga
      messageDiv.innerHTML = '<div class="alert alert-info">Creando cuenta...</div>';
      
      const isAdmin = role === 'admin';
      const result = await register(email, password, fullName, isAdmin);
      
      if (result.success) {
        messageDiv.innerHTML = '<div class="alert alert-success">¡Cuenta creada exitosamente! Por favor, verifica tu correo electrónico y luego inicia sesión.</div>';
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 3000);
      } else {
        messageDiv.innerHTML = `<div class="alert alert-error">Error: ${result.error}</div>`;
      }
    });
  </script>
</body>
</html>
