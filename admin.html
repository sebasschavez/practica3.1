<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <div class="dashboard-header">
      <h1>⚙️ Panel de Administración</h1>
      <div id="userInfo"></div>
    </div>

    <div class="nav-links">
      <a href="dashboard.html" class="btn btn-secondary">Ver Información</a>
      <a href="admin.html" class="btn btn-primary">Panel de Admin</a>
    </div>

    <!-- Formulario para crear nueva información -->
    <div class="admin-form">
      <h2>➕ Publicar Nueva Información</h2>
      <div id="createMessage"></div>
      
      <form id="createForm">
        <div class="form-group">
          <label for="title">Título</label>
          <input type="text" id="title" name="title" placeholder="Título de la información" required>
        </div>
        
        <div class="form-group">
          <label for="content">Contenido</label>
          <textarea id="content" name="content" placeholder="Escribe el contenido aquí..." required></textarea>
        </div>
        
        <button type="submit" class="btn btn-success">Publicar Información</button>
      </form>
    </div>

    <!-- Lista de información existente con opciones de eliminar -->
    <div class="admin-form">
      <h2>🗂️ Gestionar Información Existente</h2>
      <div id="loadingMessage" class="loading">Cargando información...</div>
      <div id="informationContainer"></div>
    </div>
  </div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  
  <script>
    // Inicializar página
    window.addEventListener('DOMContentLoaded', async () => {
      // Proteger página (requiere login y rol de admin)
      await protectPage(true);
      
      // Mostrar información del usuario
      await displayUserInfo();
      
      // Cargar información existente
      await loadInformation();
    });

    // Manejar formulario de creación
    const createForm = document.getElementById('createForm');
    const createMessage = document.getElementById('createMessage');

    createForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;
      
      createMessage.innerHTML = '<div class="alert alert-info">Publicando...</div>';
      
      const result = await createInformation(title, content);
      
      if (result.success) {
        createMessage.innerHTML = '<div class="alert alert-success">¡Información publicada exitosamente!</div>';
        createForm.reset();
        
        // Recargar lista
        await loadInformation();
        
        // Limpiar mensaje después de 3 segundos
        setTimeout(() => {
          createMessage.innerHTML = '';
        }, 3000);
      } else {
        createMessage.innerHTML = `<div class="alert alert-error">Error: ${result.error}</div>`;
      }
    });

    // Cargar y mostrar información con opciones de eliminar
    async function loadInformation() {
      const loadingMessage = document.getElementById('loadingMessage');
      const container = document.getElementById('informationContainer');
      
      try {
        const data = await getInformation();
        
        loadingMessage.style.display = 'none';
        
        if (data.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <h3>📭 No hay información publicada</h3>
              <p>Comienza publicando tu primera información usando el formulario de arriba.</p>
            </div>
          `;
          return;
        }
        
        let html = '<div class="information-grid">';
        
        data.forEach(item => {
          html += `
            <div class="info-card">
              <h3>${item.title}</h3>
              <div class="info-card-date">📅 ${formatDate(item.created_at)}</div>
              <p>${item.content}</p>
              <div class="info-card-actions">
                <button onclick="deleteItem('${item.id}', '${item.title}')" class="btn btn-danger">
                  🗑️ Eliminar
                </button>
              </div>
            </div>
          `;
        });
        
        html += '</div>';
        container.innerHTML = html;
        
      } catch (error) {
        loadingMessage.style.display = 'none';
        container.innerHTML = `
          <div class="alert alert-error">
            Error al cargar la información: ${error.message}
          </div>
        `;
      }
    }

    // Función para eliminar un item
    async function deleteItem(id, title) {
      if (!confirm(`¿Estás seguro de que deseas eliminar "${title}"?`)) {
        return;
      }
      
      const container = document.getElementById('informationContainer');
      const loadingMessage = document.getElementById('loadingMessage');
      
      loadingMessage.style.display = 'block';
      loadingMessage.innerHTML = '<div class="loading">Eliminando...</div>';
      
      const result = await deleteInformation(id);
      
      if (result.success) {
        // Recargar lista
        await loadInformation();
        
        // Mostrar mensaje de éxito temporal
        const successDiv = document.createElement('div');
        successDiv.innerHTML = '<div class="alert alert-success">Información eliminada exitosamente</div>';
        container.insertBefore(successDiv, container.firstChild);
        
        setTimeout(() => {
          successDiv.remove();
        }, 3000);
      } else {
        loadingMessage.style.display = 'none';
        alert(`Error al eliminar: ${result.error}`);
      }
    }

    // Hacer la función disponible globalmente
    window.deleteItem = deleteItem;
  </script>
</body>
</html>
